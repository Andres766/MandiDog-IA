# Entorno local: API + PostgreSQL.
# El análisis de las fotos lo hace el SDK de AI for Pet dentro de la app; no hay
# almacenamiento de imágenes propio.
#   cp .env.example .env
#   docker compose up -d --build
#   docker compose run --rm api pytest
name: mandidog-ia

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?define POSTGRES_DB en .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      target: dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}_test
      UVICORN_EXTRA_ARGS: --reload
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      # Abierto en la red local para probar la app desde un celular.
      - "${API_HOST_PORT:-8008}:8000"
    volumes:
      - ./api:/srv
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
