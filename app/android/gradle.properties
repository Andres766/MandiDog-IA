# La plantilla de Flutter pedía -Xmx8G, más que la RAM de un portátil de 8 GB: la JVM se
# caía con "insufficient memory". Estos valores alcanzan para compilar la app con el SDK.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1g
android.useAndroidX=true
